# Checks the live site every morning and after every deploy to main.
# If it fails, GitHub emails the repository owner. It never sends a real lead to GHL.
name: Live site check
on:
  schedule:
    - cron: "17 13 * * *"   # 8:17 am Central (daylight time)
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the Vercel deploy to finish
        if: github.event_name == 'push'
        run: sleep 180
      - name: Check nexumcf.com
        run: node tests/live/smoke.mjs https://nexumcf.com
